name: release

# A release is published only when a version tag is pushed (`git push origin vX.Y.Z`). A plain push to main
# runs ci.yml and publishes nothing. The phone's updater reads the newest release, so what this uploads is
# what every install is offered: the build is tested again, signed, and checked to carry a signature first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag is the app's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$tag" != "$built" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match appVersionName $built in app/build.gradle.kts"
            exit 1
          fi

      - name: Write the release notes from CHANGELOG.md
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :engine:test :app:testDebugUnitTest --no-daemon

      - name: Restore the signing key
        env:
          SIGNAL_LAB_KEYSTORE_BASE64: ${{ secrets.SIGNAL_LAB_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNAL_LAB_KEYSTORE_BASE64" || { echo "::error::The SIGNAL_LAB_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$SIGNAL_LAB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signal-lab.keystore"
          echo "SIGNAL_LAB_KEYSTORE_FILE=$RUNNER_TEMP/signal-lab.keystore" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          SIGNAL_LAB_KEYSTORE_PASSWORD: ${{ secrets.SIGNAL_LAB_KEYSTORE_PASSWORD }}
          SIGNAL_LAB_KEY_ALIAS: ${{ secrets.SIGNAL_LAB_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # Without the key the build still succeeds, with an unsigned file that cannot be installed.
      # Refuse to publish that.
      - name: Check the APK is signed
        run: |
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1 || { echo "::error::Expected one release APK, found ${#apks[@]}"; exit 1; }
          case "${apks[0]}" in *unsigned*) echo "::error::The release APK is unsigned"; exit 1;; esac
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "${apks[0]}"
          cp "${apks[0]}" "$RUNNER_TEMP/signal-lab-${GITHUB_REF_NAME#v}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/signal-lab-${GITHUB_REF_NAME#v}.apk" \
            --title "Signal Lab ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
