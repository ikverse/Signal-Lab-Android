name: ci

# Every push runs the engine tests, the app's tests and a debug build. Nothing is published:
# releases come only from version tags (release.yml).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # local.properties is gitignored because the SDK path is per-machine; the runner's
      # ANDROID_HOME is already set, so Gradle finds the SDK without it. (The setup-android action
      # is not used: it fails on the runner's pre-installed SDK with "Failed to find package 'tools'".)
      - name: Test
        run: ./gradlew :engine:test :app:testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: signal-lab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            engine/build/reports/tests/
            app/build/reports/tests/
